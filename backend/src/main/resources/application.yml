server:
  port: ${PORT:8080}   # Render/cloud cấp cổng qua biến PORT
spring:
  # Chuỗi kết nối MongoDB, JWT secret: đặt trong config/bocbox-local.yml (không commit,
  # mẫu ở config/bocbox-local.example.yml) hoặc bằng biến môi trường cùng tên bên dưới.
  config:
    import: optional:file:./config/bocbox-local.yml
  data:
    mongodb:
      # MongoDB Atlas: mongodb+srv://<user>:<mật khẩu>@<cluster>.mongodb.net/bocbox?retryWrites=true&w=majority
      # Máy cá nhân / docker-compose: mongodb://localhost:27017/bocbox. Tên database nằm sau dấu "/" cuối.
      uri: ${MONGODB_URI:mongodb://localhost:27017/bocbox}
      # Index (mã đơn, slug, SĐT... duy nhất) do db/bocbox-full.mongodb.js tạo, Spring không tự tạo
      auto-index-creation: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      # ảnh khách tải lên để in áo (frontend đã thu nhỏ, backend chặn ở 3 MB)
      max-file-size: 4MB
      max-request-size: 5MB
# Toàn bộ mục bocbox.* được đọc vào config/BocboxProperties.java
bocbox:
  price: 350000
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  payment:
    bank-id: ${BANK_ID:970436}          # mã BIN ngân hàng (ví dụ Vietcombank) - thay bằng tài khoản thật
    account-no: ${BANK_ACCOUNT:0000000000}
    account-name: ${BANK_ACCOUNT_NAME:BOCBOX DEMO}
  jwt:
    secret: ${JWT_SECRET:}          # bắt buộc, >= 32 ký tự
    ttl-hours: 12                   # phiên nhân viên
    customer-ttl-days: 30           # phiên khách (đăng nhập 1 lần dùng cả tháng)
  login:
    max-failures: 5                 # sai quá số lần này thì khóa đăng nhập tạm thời
    lock-minutes: 15
  report:
    break-even-boxes: 21            # mốc hòa vốn mỗi tháng (box)
    gross-profit-per-box: 145000    # lãi gộp ước tính mỗi box (đồng)
  # Mỗi request /api/** in 1 dòng: GET /api/v1/memes -> 200 (12 ms) [token]. Đặt false để tắt.
  request-log: ${REQUEST_LOG:true}
logging:
  level:
    # Đặt DEBUG (hoặc biến môi trường DB_LOG=DEBUG) để thấy từng truy vấn gửi xuống MongoDB
    org.springframework.data.mongodb.core.MongoTemplate: ${DB_LOG:INFO}
