# Chạy cả hệ thống: docker compose up -d --build
# Web: http://localhost:3000 · API: http://localhost:8080/api/v1 · SQL Server: localhost,1434 (sa)
# Đổi mật khẩu/secret: tạo file .env cạnh file này (SA_PASSWORD=..., JWT_SECRET=...), không commit.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-YourStrong@Password123}  # Mật khẩu tài khoản sa
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "1434:1433"   # máy đã cài SQL Server chiếm 1433 nên map ra 1434 (SSMS: localhost,1434)
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:      # backend chỉ khởi động khi SQL Server nhận kết nối thật
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app-network

  # Chạy backend/sql/bocbox-full.sql một lần khi chưa có database bocbox (volume mới).
  # Muốn dựng lại DB từ đầu: docker compose down -v rồi up lại.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:-YourStrong@Password123}
    volumes:
      - ./backend/sql:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        S="/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P $$MSSQL_SA_PASSWORD -C"
        if [ "$$($$S -h -1 -W -Q "SET NOCOUNT ON; SELECT DB_ID('bocbox')" | tr -d '[:space:]')" = "NULL" ]; then
          echo "Chua co database bocbox -> chay bocbox-full.sql"
          $$S -f 65001 -b -i /sql/bocbox-full.sql
        else
          echo "Database bocbox da co, bo qua"
        fi
    restart: "no"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: spring_boot_backend
    ports:
      - "8080:8080"   # tắt backend chạy trong IntelliJ trước, kẻo trùng cổng
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      # Kết nối trực tiếp tới container 'sqlserver' (cổng trong mạng docker vẫn là 1433)
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=bocbox;encrypt=true;trustServerCertificate=true
      - DB_USER=sa
      - DB_PASSWORD=${SA_PASSWORD:-YourStrong@Password123}
      - JWT_SECRET=${JWT_SECRET:-YourSuperSecretKeyWithAtLeast32CharactersLong!}
      - CORS_ORIGINS=http://localhost:3000
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_PROFILES_ACTIVE=docker   # application-docker.yml: lấy IP thật của khách sau nginx
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: react_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mssql-data:
