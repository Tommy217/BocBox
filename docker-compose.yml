# Chạy cả hệ thống: docker compose up -d --build
# Web: http://localhost:3000 · API: http://localhost:8080/api/v1 · MongoDB: mongodb://localhost:27017
# Đổi JWT secret: tạo file .env cạnh file này (JWT_SECRET=...), không commit.
services:
  mongo:
    image: mongo:7
    container_name: bocbox_mongo
    environment:
      - TZ=Asia/Ho_Chi_Minh
    ports:
      - "27017:27017"   # MongoDB Compass: mongodb://localhost:27017
    volumes:
      - mongo-data:/data/db
      # Lần đầu (volume trống) mongo tự chạy script này: tạo database bocbox + dữ liệu mẫu.
      # Muốn dựng lại từ đầu: docker compose down -v rồi up lại.
      - ./backend/db/bocbox-full.mongodb.js:/docker-entrypoint-initdb.d/bocbox-full.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: spring_boot_backend
    ports:
      - "8080:8080"   # tắt backend chạy trong IntelliJ trước, kẻo trùng cổng
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Kết nối tới container 'mongo' trong mạng docker
      - MONGODB_URI=mongodb://mongo:27017/bocbox
      - JWT_SECRET=${JWT_SECRET:-YourSuperSecretKeyWithAtLeast32CharactersLong!}
      - CORS_ORIGINS=http://localhost:3000
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_PROFILES_ACTIVE=docker   # application-docker.yml: lấy IP thật của khách sau nginx
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: react_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
